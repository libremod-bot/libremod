services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-libremod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
      POSTGRES_DB: ${POSTGRES_DB:-libremod}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: ["CMD", "node", "dist/health.js"]
      interval: 30s
      timeout: 10s
      start_period: 3m
      retries: 3
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-libremod}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-libremod}
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 1m
      retries: 3
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-libremod}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-libremod}
    # Nur lokal erreichbar. Davor gehört ein Reverse Proxy mit HTTPS (siehe README).
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      bot:
        condition: service_started

volumes:
  db-data:
